<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Óculos VR com mão</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<style>
:root{color-scheme:dark;--fg:#f3f6ff;--mut:rgba(243,246,255,.6);--ac:#60c4ff}
html,body{height:100%;margin:0;background:#000;color:var(--fg);font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#start{position:fixed;inset:0;z-index:9;background:radial-gradient(ellipse at 50% 30%,#14202f,#03050a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;box-sizing:border-box}
#start h1{margin:0;font-size:24px;font-weight:700}
#start p{margin:0;max-width:460px;color:var(--mut);font-size:14px;line-height:1.5}
#msg{color:#ffb4b4;font-size:13px;min-height:16px;max-width:440px}
.gbtn{font:inherit;font-weight:600;color:#06080d;background:var(--ac);border:0;border-radius:12px;padding:11px 18px;cursor:pointer}
.gbtn.alt{background:transparent;color:var(--fg);border:1px solid rgba(96,196,255,.6)}

#stage{position:fixed;inset:0;display:flex}
.eye{flex:1;position:relative;overflow:hidden;background:#000}
.eye+.eye{border-left:2px solid #000}
.eye>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eye>canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.eye.virt>video{display:none}
.eye.virt{background:radial-gradient(ellipse at 50% 35%,#16263d 0%,#05080f 65%)}
.eye.virt::before{content:"";position:absolute;left:-60%;right:-60%;bottom:0;height:55%;background:repeating-linear-gradient(90deg,rgba(96,196,255,.14) 0 1px,transparent 1px 64px),repeating-linear-gradient(0deg,rgba(96,196,255,.14) 0 1px,transparent 1px 64px);transform:perspective(420px) rotateX(70deg);transform-origin:bottom;pointer-events:none}

.status{position:absolute;top:calc(var(--u)*8);left:calc(var(--u)*8);font-size:calc(var(--u)*11);color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);padding:3px 8px;border-radius:8px;z-index:6;pointer-events:none}
.cur{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:rgba(96,196,255,.35);border:2px solid #fff;pointer-events:none;display:none;z-index:5;box-shadow:0 0 12px rgba(96,196,255,.7)}
.cur.p{background:#fff}

.loader{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:10px;z-index:6;color:var(--fg);font-size:calc(var(--u)*13);background:rgba(16,18,24,.85);padding:calc(var(--u)*18) calc(var(--u)*26);border-radius:calc(var(--u)*18);border:1px solid rgba(255,255,255,.1)}
.loader.on{display:flex}
.loader i{width:calc(var(--u)*40);height:calc(var(--u)*40);border:3px solid rgba(96,196,255,.2);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* janelas comuns */
.panel{position:absolute;width:calc(var(--u)*270);transform:translate(-50%,-50%);background:linear-gradient(180deg,#262a33,#171a21);border:1px solid rgba(255,255,255,.1);border-radius:calc(var(--u)*22);z-index:2;display:none;box-shadow:0 26px 60px rgba(0,0,0,.6);overflow:hidden;box-sizing:border-box}
.panel.big{width:calc(var(--u)*340)}
.panel.grab{box-shadow:0 0 0 2px rgba(96,196,255,.8),0 26px 60px rgba(0,0,0,.6)}
.head{display:flex;align-items:center;gap:calc(var(--u)*8);height:calc(var(--u)*42);padding:0 calc(var(--u)*10);background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.06)}
.ic{width:calc(var(--u)*24);height:calc(var(--u)*24);display:block;flex:none}
.ic svg{width:100%;height:100%;display:block}
.name{flex:1;text-align:left;font-size:calc(var(--u)*13);font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xbtn{width:calc(var(--u)*26);height:calc(var(--u)*26);border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--fg);font-size:calc(var(--u)*12);cursor:pointer;flex:none}
.xbtn:hover{background:rgba(255,80,80,.6)}
.body{padding:calc(var(--u)*12)}
.grip{height:calc(var(--u)*16);display:flex;align-items:center;justify-content:center}
.grip::after{content:"";width:calc(var(--u)*60);height:calc(var(--u)*4);border-radius:4px;background:rgba(255,255,255,.22)}
.big-num{font-size:calc(var(--u)*46);font-weight:300;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.1;text-align:center}
.sub{font-size:calc(var(--u)*12);color:var(--mut);margin-top:calc(var(--u)*4);text-align:center;text-transform:capitalize}
.panel iframe{width:100%;height:calc(var(--u)*170);border:0;border-radius:calc(var(--u)*14);background:#000;display:block}
.panel.big iframe{height:calc(var(--u)*280)}
.row{display:flex;gap:calc(var(--u)*8);justify-content:center;margin-top:calc(var(--u)*10)}
.btn{font:inherit;font-size:calc(var(--u)*12);font-weight:500;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:calc(var(--u)*12);padding:calc(var(--u)*8) calc(var(--u)*12);cursor:pointer}
.btn.primary{background:var(--ac);color:#06080d;border:0;font-weight:600}
.field{margin-top:calc(var(--u)*4);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:calc(var(--u)*12);padding:calc(var(--u)*9);font-size:calc(var(--u)*16);min-height:calc(var(--u)*36);text-align:left;box-sizing:border-box}
.field .ph{color:var(--mut)}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:calc(var(--u)*4);margin-top:calc(var(--u)*8)}
.keys .btn{padding:calc(var(--u)*6) 0;font-size:calc(var(--u)*11);text-align:center}

/* menu de apps: estilo Windows 11 (Iniciar) */
.panel.start{width:calc(var(--u)*380);background:rgba(28,30,36,.82);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);border:1px solid rgba(255,255,255,.09);border-radius:calc(var(--u)*26);box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
.search{margin:calc(var(--u)*18) calc(var(--u)*18) 0;height:calc(var(--u)*40);border-radius:calc(var(--u)*20);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:calc(var(--u)*8);padding:0 calc(var(--u)*14);color:var(--mut);font-size:calc(var(--u)*13);cursor:pointer}
.search:hover{background:rgba(255,255,255,.1)}
.sec{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--u)*18) calc(var(--u)*22) calc(var(--u)*8);font-size:calc(var(--u)*13);font-weight:600}
.sec span{font-size:calc(var(--u)*10);font-weight:500;color:var(--mut)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*4);padding:0 calc(var(--u)*14)}
.app{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*7);padding:calc(var(--u)*10) calc(var(--u)*2);border-radius:calc(var(--u)*14);background:transparent;border:0;color:var(--fg);font:inherit;font-size:calc(var(--u)*11);cursor:pointer}
.app:hover{background:rgba(255,255,255,.07)}
.app .ic{width:calc(var(--u)*46);height:calc(var(--u)*46)}
.app.on span:last-child{color:var(--ac)}
.foot{display:flex;gap:calc(var(--u)*6);justify-content:space-between;align-items:center;margin:calc(var(--u)*12) calc(var(--u)*14) calc(var(--u)*14);padding-top:calc(var(--u)*12);border-top:1px solid rgba(255,255,255,.07)}
.pill{font:inherit;font-size:calc(var(--u)*11);color:var(--fg);background:rgba(255,255,255,.07);border:0;border-radius:999px;padding:calc(var(--u)*8) calc(var(--u)*11);cursor:pointer;white-space:nowrap}
.pill:hover{background:rgba(255,255,255,.12)}
.pill.on{background:var(--ac);color:#06080d;font-weight:600}
</style>
</head>
<body>
<div id="start">
  <h1>Óculos VR com mão</h1>
  <p>Coloque o celular na caixa com a câmera de trás apontando para frente. Faça o gesto ✌🏻 e segure um instante para abrir o menu de apps. Aperte com a pinça (polegar + indicador). Para redimensionar um painel, pince com as duas mãos sobre ele e afaste ou aproxime as mãos.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="gbtn" id="go2">Iniciar (2 olhos)</button>
    <button class="gbtn alt" id="go1">Iniciar (tela única)</button>
  </div>
  <div id="msg"></div>
</div>
<div id="stage"></div>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
// Troque pelos IDs dos seus vídeos (o trecho depois de watch?v=)
const YT = ['dQw4w9WgXcQ', 'jNQXAC9IVRw', 'M7lc1UVf-VE'];
const LET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const pad = n => String(n).padStart(2, '0');
const D = Math.PI / 180;
const FOV_K = 0.87;
const HAND_LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];

const ICON = {
  clock: '<svg viewBox="0 0 40 40"><defs><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa8ff"/><stop offset="1" stop-color="#2f5bff"/></linearGradient></defs><rect x="1" y="1" width="38" height="38" rx="11" fill="url(#gc)"/><circle cx="20" cy="20" r="10.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M20 13v7.5l4.5 3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',
  sw: '<svg viewBox="0 0 40 40"><defs><linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb14a"/><stop offset="1" stop-color="#ff7a1a"/></linearGradient></defs><rect x="1" y="1" width="38" height="38" rx="11" fill="url(#gs)"/><rect x="17.5" y="5" width="5" height="4" rx="1.5" fill="#fff"/><circle cx="20" cy="22" r="10" fill="none" stroke="#fff" stroke-width="2"/><path d="M20 22l3.5-4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>',
  yt: '<svg viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="11" fill="#ff2a44"/><rect x="5" y="10" width="30" height="20" rx="7" fill="#fff" opacity=".12"/><path d="M16 14.5v11l9.5-5.5z" fill="#fff"/></svg>',
  search: '<svg viewBox="0 0 40 40"><defs><linearGradient id="gq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b7bff"/><stop offset="1" stop-color="#5b3cf0"/></linearGradient></defs><rect x="1" y="1" width="38" height="38" rx="11" fill="url(#gq)"/><circle cx="18" cy="18" r="7" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M23.5 23.5l6 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>',
  web: '<svg viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="11" fill="#2ec27e"/><circle cx="20" cy="20" r="10" fill="none" stroke="#fff" stroke-width="2"/><path d="M10 20h20M20 10c-4 4-4 16 0 20M20 10c4 4 4 16 0 20" fill="none" stroke="#fff" stroke-width="1.8"/></svg>',
  drawer: '<svg viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="11" fill="#2b3140"/><g fill="#fff"><circle cx="12" cy="12" r="2.4"/><circle cx="20" cy="12" r="2.4"/><circle cx="28" cy="12" r="2.4"/><circle cx="12" cy="20" r="2.4"/><circle cx="20" cy="20" r="2.4"/><circle cx="28" cy="20" r="2.4"/><circle cx="12" cy="28" r="2.4"/><circle cx="20" cy="28" r="2.4"/><circle cx="28" cy="28" r="2.4"/></g></svg>'
};
const APPS = [
  {t: 'clock', name: 'Relógio'}, {t: 'sw', name: 'Cronômetro'}, {t: 'yt', name: 'YouTube'}, {t: 'search', name: 'Pesquisa'}
];
const TITLES = {clock: 'Relógio', sw: 'Cronômetro', yt: 'YouTube', search: 'Pesquisa', drawer: 'Aplicativos'};
const REL = {clock: [-20, 6], sw: [20, 6], yt: [-14, -8], search: [14, -8], drawer: [0, -4], web: [0, 0]};

let panels = [], eyes = [], nextId = 1;
let sw = {run: false, t0: 0, acc: 0};
let HS = [mkHand(), mkHand()];
function mkHand() { return {ok: false, lm: null, px: 0, py: 0, has: false, pinched: false, grab: null}; }
let video = null, virtual = false;
let FLIP_Y = (() => { try { return localStorage.getItem('flipY') === '1'; } catch (e) { return false; } })();
let ori = null, yaw0 = 0, pitch0 = 0;
let peaceStart = 0, loading = false, cooldownUntil = 0;

const swMs = () => sw.acc + (sw.run ? performance.now() - sw.t0 : 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const unit = v => { const n = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/n, v[1]/n, v[2]/n]; };
const dirOf = (yaw, p) => [Math.sin(yaw)*Math.cos(p), Math.cos(yaw)*Math.cos(p), Math.sin(p)];
const yawOf = v => Math.atan2(v[0], v[1]);
const pitchOf = v => Math.asin(clamp(v[2], -1, 1));

// suaviza o giroscópio (filtro simples) para os painéis não tremerem
addEventListener('deviceorientation', e => {
  if (e.alpha == null) return;
  const n = [e.alpha, e.beta, e.gamma];
  if (!ori) { ori = n; return; }
  const dA = ((n[0] - ori[0] + 540) % 360) - 180;
  ori = [(ori[0] + 0.25 * dA + 360) % 360, ori[1] + 0.25 * (n[1] - ori[1]), ori[2] + 0.25 * (n[2] - ori[2])];
});

function camBasis() {
  if (!ori) return {f: [0, 1, 0], r: [1, 0, 0], u: [0, 0, 1]};
  const [a, b, g] = ori.map(v => v * D);
  const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), cg = Math.cos(g), sg = Math.sin(g);
  const X = [ca*cg - sa*sb*sg, sa*cg + ca*sb*sg, -cb*sg];
  const Y = [-sa*cb, ca*cb, sb];
  const Z = [-(ca*sg + sa*sb*cg), -(sa*sg - ca*sb*cg), -(cb*cg)];
  const ang = (((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) % 360 + 360) % 360;
  const neg = v => [-v[0], -v[1], -v[2]];
  const m = {0: [X, Y], 90: [neg(Y), X], 180: [neg(X), neg(Y)], 270: [Y, neg(X)]}[ang] || [X, Y];
  return {f: Z.map(v => -v), r: neg(m[0]), u: FLIP_Y ? neg(m[1]) : m[1]};
}
function project(d, B, W, H) {
  const a = dot(d, B.f);
  if (a < 0.2) return null;
  const F = H * FOV_K;
  return {x: W/2 + F * dot(d, B.r) / a, y: H/2 - F * dot(d, B.u) / a};
}
function rayOf(X, Y, B, W, H) {
  const F = H * FOV_K, sx = (X - W/2) / F, sy = (H/2 - Y) / F;
  return unit([0,1,2].map(i => B.f[i] + sx*B.r[i] + sy*B.u[i]));
}

// ---------- conteúdo ----------
function head(p) {
  if (p.type === 'drawer') return '';
  return `<div class="head"><span class="ic">${ICON[p.iconKey || p.type]}</span><span class="name">${p.title}</span><button class="xbtn" data-act="close" title="fechar">✕</button></div>`;
}
function tpl(p) {
  switch (p.type) {
    case 'clock': return '<div class="body"><div class="big-num" data-bind="clock"></div><div class="sub" data-bind="date"></div></div><div class="grip"></div>';
    case 'sw': return '<div class="body"><div class="big-num" data-bind="sw"></div><div class="row"><button class="btn primary" data-act="sw">iniciar / pausar</button><button class="btn" data-act="swr">zerar</button></div></div><div class="grip"></div>';
    case 'yt': return `<div class="body"><iframe src="https://www.youtube-nocookie.com/embed/${YT[p.i]}" allow="autoplay; encrypted-media" allowfullscreen></iframe><div class="row"><button class="btn" data-act="ytp">◀ anterior</button><button class="btn primary" data-act="ytn">próximo ▶</button></div></div><div class="grip"></div>`;
    case 'search': return `<div class="body"><div class="field">${p.q ? p.q : '<span class="ph">digite uma busca…</span>'}</div><div class="keys">${LET.map(l => `<button class="btn" data-act="k" data-k="${l}">${l}</button>`).join('')}<button class="btn" data-act="k" data-k=" ">espaço</button><button class="btn" data-act="del">⌫</button><button class="btn primary" data-act="go">buscar</button></div></div><div class="grip"></div>`;
    case 'web': return `<div class="body"><iframe src="${p.url}"></iframe></div><div class="grip"></div>`;
    case 'drawer': return `
      <div class="search" data-act="tog" data-t="search">🔎&nbsp; Pesquisar aplicativos</div>
      <div class="sec">Fixados <span>todos os apps</span></div>
      <div class="grid4">${APPS.map(a => `<button class="app" data-act="tog" data-t="${a.t}"><span class="ic">${ICON[a.t]}</span><span>${a.name}</span></button>`).join('')}</div>
      <div class="foot">
        <button class="pill" data-act="rc">⟲ Recentralizar</button>
        <button class="pill" data-act="env" data-t="env">🌌 Ambiente</button>
        <button class="pill" data-act="flipy">↕ Inverter</button>
      </div>`;
  }
}

function appendPanel(p) {
  eyes.forEach(e => {
    const d = document.createElement('div');
    d.className = 'panel' + (p.type === 'web' ? ' big' : '') + (p.type === 'drawer' ? ' start' : '');
    d.dataset.id = p.id;
    d.innerHTML = head(p) + tpl(p);
    e.el.appendChild(d);
  });
}
function renderPanel(p) {
  eyes.forEach(e => { const b = e.el.querySelector(`.panel[data-id="${p.id}"] .body`); if (b) b.outerHTML = tpl(p); });
}
function addPanel(o, rel) {
  o.id = nextId++;
  const r = rel || REL[o.type] || [0, 0];
  o.ry = r[0]*D; o.rp = r[1]*D;
  panels.push(o); appendPanel(o);
  return o;
}
function panelOfType(t) { return panels.find(p => p.type === t); }
function closePanel(p) {
  panels = panels.filter(q => q !== p);
  eyes.forEach(e => e.el.querySelectorAll(`.panel[data-id="${p.id}"]`).forEach(n => n.remove()));
  HS.forEach(h => { if (h.grab && h.grab.p === p) h.grab = null; });
  refreshTaskbar();
}
function openAt(type, title, extra) {
  const B = camBasis();
  const p = addPanel(Object.assign({type, title}, extra || {}), [0, 0]);
  p.ry = wrap(yawOf(B.f) - yaw0); p.rp = pitchOf(B.f) - pitch0;
  refreshTaskbar();
  return p;
}
function togglePanel(type) {
  const ex = panelOfType(type);
  if (ex) { closePanel(ex); return; }
  openAt(type, TITLES[type], {i: 0, q: ''});
}
function toggleDrawer() {
  const ex = panelOfType('drawer');
  if (ex) closePanel(ex); else openAt('drawer', TITLES.drawer);
}

// marca os botões ativos (apps abertos, ambiente)
function refreshTaskbar() {
  eyes.forEach(e => {
    e.el.querySelectorAll('[data-t]').forEach(b => {
      const t = b.dataset.t;
      b.classList.toggle('on', t === 'env' ? virtual : !!panelOfType(t));
    });
  });
}
function setVirtual(v) {
  virtual = v;
  eyes.forEach(e => e.el.classList.toggle('virt', v));
  refreshTaskbar();
}

function buildEyes(n) {
  $('#stage').innerHTML = ''; eyes = [];
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div'); el.className = 'eye' + (virtual ? ' virt' : '');
    el.innerHTML = '<video autoplay muted playsinline></video><canvas></canvas><div class="loader"><i></i><span>abrindo aplicativos…</span></div><div class="cur"></div><div class="cur"></div><div class="status"></div>';
    const vid = el.querySelector('video'); vid.srcObject = window.stream;
    $('#stage').appendChild(el);
    eyes.push({el, vid, cv: el.querySelector('canvas'), curs: el.querySelectorAll('.cur')});
  }
  panels.forEach(appendPanel);
  refreshTaskbar();
}
function setLoader(v) { eyes.forEach(e => e.el.querySelector('.loader').classList.toggle('on', v)); }

// gesto de paz: indicador e médio levantados, anelar e mínimo dobrados
function isPeace(lm) {
  const up = (t, p) => lm[t].y < lm[p].y - 0.02;
  const down = (t, p) => lm[t].y > lm[p].y;
  return up(8, 6) && up(12, 10) && down(16, 14) && down(20, 18);
}
function checkPeace(list, now) {
  const peace = list.some(l => l && isPeace(l));
  if (!peace) { peaceStart = 0; if (loading) { loading = false; setLoader(false); } return; }
  if (loading || now < cooldownUntil) return;
  if (!peaceStart) peaceStart = now;
  if (now - peaceStart > 650) {
    loading = true; setLoader(true);
    setTimeout(() => { setLoader(false); toggleDrawer(); loading = false; peaceStart = 0; cooldownUntil = performance.now() + 1800; }, 900);
  }
}

function recenter() {
  const B = camBasis();
  yaw0 = yawOf(B.f); pitch0 = pitchOf(B.f);
}

function updateBindings() {
  const d = new Date();
  const map = {
    clock: pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()),
    date: d.toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'}),
    sw: (() => { const t = swMs(); return pad(Math.floor(t/60000)) + ':' + pad(Math.floor(t/1000)%60) + '.' + pad(Math.floor(t/10)%100); })()
  };
  eyes.forEach(e => e.el.querySelectorAll('[data-bind]').forEach(n => { const v = map[n.dataset.bind]; if (v !== undefined && n.textContent !== v) n.textContent = v; }));
}

function layout() {
  const B = camBasis();
  eyes.forEach(e => {
    const W = e.el.clientWidth, H = e.el.clientHeight;
    e.el.style.setProperty('--u', H / 400);
    panels.forEach(p => {
      const d = e.el.querySelector(`.panel[data-id="${p.id}"]`);
      if (!d) return;
      const pr = project(dirOf(yaw0 + p.ry, pitch0 + p.rp), B, W, H);
      const onScreen = pr && pr.x > -W*0.3 && pr.x < W*1.3 && pr.y > -H*0.3 && pr.y < H*1.3;
      if (!onScreen) { d.style.display = 'none'; return; }
      d.style.display = 'block';
      d.style.left = pr.x + 'px'; d.style.top = pr.y + 'px';
      d.style.transform = `translate(-50%,-50%) scale(${p.scale || 1})`;
      d.classList.toggle('grab', HS.some(h => h.grab && h.grab.p === p));
    });
    drawHands(e, W, H);
  });
}

function mapCam(x, y, W, H) {
  const vw = video.videoWidth || 1, vh = video.videoHeight || 1;
  const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s;
  return [(W - dw) / 2 + x * dw, (H - dh) / 2 + y * dh];
}
function drawHands(e, W, H) {
  const cv = e.cv;
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const c = cv.getContext('2d');
  c.clearRect(0, 0, W, H);
  if (virtual) return;
  HS.forEach(h => {
    if (!h.ok || !h.lm) return;
    const pts = h.lm.map(p => mapCam(p.x, p.y, W, H));
    c.lineCap = 'round';
    HAND_LINKS.forEach(([a, b]) => {
      c.beginPath(); c.moveTo(pts[a][0], pts[a][1]); c.lineTo(pts[b][0], pts[b][1]);
      c.strokeStyle = 'rgba(96,196,255,.35)'; c.lineWidth = 8; c.stroke();
      c.strokeStyle = '#9fe4ff'; c.lineWidth = 2; c.stroke();
    });
    const g = c.createLinearGradient(pts[5][0], pts[5][1], h.px, h.py);
    g.addColorStop(0, 'rgba(96,196,255,0)');
    g.addColorStop(1, h.pinched ? 'rgba(255,255,255,1)' : 'rgba(159,228,255,.9)');
    c.beginPath(); c.moveTo(pts[5][0], pts[5][1]); c.lineTo(h.px, h.py);
    c.strokeStyle = g; c.lineWidth = h.pinched ? 4 : 3; c.stroke();
    [4, 8, 12, 16, 20].forEach(i => {
      c.beginPath(); c.arc(pts[i][0], pts[i][1], 5, 0, Math.PI * 2);
      c.fillStyle = 'rgba(159,228,255,.9)'; c.fill();
    });
  });
}

function setCursors() {
  const txt = (HS.some(h => h.ok) ? 'mão ✓' : 'sem mão') + ' · ' + (ori ? 'giro ✓' : 'sem giro');
  eyes.forEach(e => { const s = e.el.querySelector('.status'); if (s) s.textContent = txt; });
  eyes.forEach(e => {
    e.curs.forEach((cur, i) => {
      const h = HS[i];
      cur.style.display = h.ok ? 'block' : 'none';
      cur.style.left = h.px + 'px'; cur.style.top = h.py + 'px';
      cur.classList.toggle('p', h.pinched);
    });
  });
}

// ---------- mãos ----------
function handPoint(i, lm, W, H) {
  const h = HS[i];
  const [tx, ty] = mapCam(lm[8].x, lm[8].y, W, H);
  h.px = h.has ? h.px * 0.5 + tx * 0.5 : tx;
  h.py = h.has ? h.py * 0.5 + ty * 0.5 : ty;
  h.has = true;
}
function startPress(i) {
  const h = HS[i];
  const e0 = eyes[0].el, r = e0.getBoundingClientRect();
  const el = document.elementFromPoint(r.left + h.px, r.top + h.py);
  if (!el) return;
  const btn = el.closest('[data-act]');
  if (btn) { btn.click(); return; }
  const pn = el.closest('.panel');
  const p = pn && panels.find(q => q.id === +pn.dataset.id);
  if (p) {
    const B = camBasis(), W = e0.clientWidth, H = e0.clientHeight;
    const rv = rayOf(h.px, h.py, B, W, H);
    h.grab = {p, oy: wrap((yaw0 + p.ry) - yawOf(rv)), op: (pitch0 + p.rp) - pitchOf(rv)};
  }
}
function driveGrab(h, resizing) {
  if (!h.grab) return;
  const p = h.grab.p, e0 = eyes[0].el, W = e0.clientWidth, H = e0.clientHeight;
  const B = camBasis(), rv = rayOf(h.px, h.py, B, W, H);
  if (resizing) { h.grab.oy = wrap((yaw0 + p.ry) - yawOf(rv)); h.grab.op = (pitch0 + p.rp) - pitchOf(rv); return; }
  p.ry = wrap(yawOf(rv) + h.grab.oy - yaw0);
  p.rp = clamp(pitchOf(rv) + h.grab.op - pitch0, -75*D, 75*D);
}

function onHands(res) {
  const list = res.multiHandLandmarks || [];
  checkPeace(list, performance.now());
  const e0 = eyes[0].el, W = e0.clientWidth, H = e0.clientHeight;

  HS.forEach((h, i) => {
    const lm = list[i];
    if (!lm) { h.ok = false; h.pinched = false; h.has = false; h.grab = null; h.lm = null; return; }
    h.ok = true; h.lm = lm;
    handPoint(i, lm, W, H);
    const hs = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y) || 1;
    const pd = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) / hs;
    const was = h.pinched;
    h.pinched = was ? pd < 0.5 : pd < 0.3;
    if (h.pinched && !was && !loading) startPress(i);
    if (!h.pinched && was) h.grab = null;
  });

  // duas mãos pinçando o mesmo painel: redimensiona pela distância entre elas
  const [A, Bh] = HS;
  const both = A.ok && Bh.ok && A.pinched && Bh.pinched && A.grab && Bh.grab && A.grab.p === Bh.grab.p;
  panels.forEach(p => { if (!both || p !== (A.grab && A.grab.p)) delete p.rs; });
  if (both) {
    const p = A.grab.p;
    const d = Math.hypot(A.px - Bh.px, A.py - Bh.py);
    if (!p.rs) p.rs = {d0: Math.max(20, d), s0: p.scale || 1};
    p.scale = clamp(p.rs.s0 * d / p.rs.d0, 0.45, 2.6);
    driveGrab(A, true); driveGrab(Bh, true);
  } else {
    HS.forEach(h => driveGrab(h, false));
  }
  setCursors();
}

document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-act]');
  if (!b) return;
  const pn = b.closest('.panel');
  const p = pn && panels.find(q => q.id === +pn.dataset.id);
  const a = b.dataset.act;
  if (a === 'close' && p) { closePanel(p); return; }
  if (a === 'drawer') { toggleDrawer(); return; }
  if (a === 'tog') { togglePanel(b.dataset.t); return; }
  if (a === 'env') { setVirtual(!virtual); return; }
  if (a === 'flipy') { FLIP_Y = !FLIP_Y; try { localStorage.setItem('flipY', FLIP_Y ? '1' : '0'); } catch (err) {} return; }
  if (a === 'sw') { if (sw.run) { sw.acc = swMs(); sw.run = false; } else { sw.t0 = performance.now(); sw.run = true; } }
  else if (a === 'swr') { sw = {run: false, t0: 0, acc: 0}; }
  else if (a === 'rc') { recenter(); }
  else if (a === 'ytn' && p) { p.i = (p.i + 1) % YT.length; renderPanel(p); }
  else if (a === 'ytp' && p) { p.i = (p.i - 1 + YT.length) % YT.length; renderPanel(p); }
  else if (a === 'k' && p) { p.q = (p.q || '') + b.dataset.k; renderPanel(p); }
  else if (a === 'del' && p) { p.q = (p.q || '').slice(0, -1); renderPanel(p); }
  else if (a === 'go' && p && p.q) {
    const B = camBasis();
    const url = 'https://pt.wikipedia.org/wiki/Especial:Pesquisar?search=' + encodeURIComponent(p.q);
    const np = addPanel({type: 'web', title: p.q, url, iconKey: 'web'}, [0, 0]);
    np.ry = wrap(yawOf(B.f) - yaw0); np.rp = pitchOf(B.f) - pitch0;
  }
  refreshTaskbar();
});

function loadHands() {
  if (typeof Hands === 'undefined') { $('#msg').textContent = 'Não consegui carregar o detector de mãos (sem internet?). Os painéis continuam funcionando com o mouse.'; return; }
  hands = new Hands({locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f});
  hands.setOptions({maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5});
  hands.onResults(onHands);
}
let hands = null, busy = false;

async function tick() {
  if (hands && video && video.readyState >= 2 && !busy) {
    busy = true;
    try { await hands.send({image: video}); } catch (e) {}
    busy = false;
  }
  updateBindings();
  layout();
  requestAnimationFrame(tick);
}

async function start(n) {
  try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch (e) {}
  try {
    window.stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}, audio: false});
  } catch (e) {
    $('#msg').textContent = 'Não consegui abrir a câmera. Permita o acesso à câmera e tente de novo.';
    return;
  }
  panels = [];
  buildEyes(n);
  openAt('drawer', TITLES.drawer);
  video = eyes[0].vid;
  $('#start').style.display = 'none';
  loadHands();
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  try { await screen.orientation.lock('landscape'); } catch (e) {}
  setTimeout(recenter, 800);
  requestAnimationFrame(tick);
}
$('#go2').onclick = () => start(2);
$('#go1').onclick = () => start(1);
</script>
</body>
</html>
